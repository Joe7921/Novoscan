# ══════════════════════════════════════════════════════════════
# Novoscan-Open-Core — Docker Compose
#
# 一键启动:
#   docker compose up
#
# 配置 API Key（可选）:
#   1. 复制 .env.example → .env
#   2. 编辑 .env 填入你的 API Key
#   3. docker compose up
#
# 或者启动后通过 Web UI 设置页面在线配置
# ══════════════════════════════════════════════════════════════

services:
  novoscan-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novoscan-core
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

[project]
name = "novoscan-open-core"
version = "0.1.0"
description = "Novoscan 创新性检测引擎 — LangGraph 标准管线"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # LangGraph 图编排引擎
    "langgraph>=0.4.0",
    # LangChain 核心 + OpenAI-Compatible 通用接口
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    # FastAPI 服务框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.26",
    # 配置管理
    "pydantic-settings>=2.7.0",
    # HTTP 客户端（检索工具用）
    "httpx>=0.28.0",
    # SQLite 持久化（Phase 8 可切 PostgreSQL）
    "aiosqlite>=0.21.0",
    # YAML 解析（积木协议层）
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]
streamlit = [
    "streamlit>=1.42.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
